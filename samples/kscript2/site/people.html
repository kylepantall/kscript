<!doctype html>
<let name="people" value="@read_json('data/people.json')" />
<let name="min" value="$request.query.min_age ?? 0" />
<layout path="_layout.html" title="People">
  <h1>People over {$min}</h1>
  <if $people->any(fn($p) => $p.age ge $min)>
    <ul>
      <for each="p" in="$people |> filter(fn($p) => $p.age ge $min)">
        <li class="{ $p.age ge 65 ? 'senior' : '' }">
          <a href="/people/{$p.id}">{$p.name}</a> ({$p.age})
        </li>
      </for>
    </ul>
  </if>
  <else>
    <p>Nobody matches.</p>
  </else>
  <people-card person="{$people[0]}" />
  <input type="checkbox" checked="{$min gt 0}">
  <br>
</layout>
