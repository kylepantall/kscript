<import package="KScript.Auth" />
<layout src="/_layout.html" title="Reset your password">
  <h1>Reset your password</h1>
  <if test="$session->has('status')"><p class="status">{ $session->get('status') }</p></if>
  <if test="$data.error != null"><p class="error">{ $data.error }</p></if>
  <form method="post" action="/forgot-password">
    {! @csrf_field() }
    <p><label>Email<br><input type="email" name="email" required autocomplete="email"></label></p>
    <p><button>Send me a link</button></p>
  </form>
  <p><a href="/login">Back to sign in</a></p>
</layout>
