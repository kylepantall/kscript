<import package="KScript.Auth" />
<layout src="/_layout.html" title="Choose a new password">
  <h1>Choose a new password</h1>
  <if test="$data.error != null"><p class="error">{ $data.error }</p></if>
  <form method="post" action="/reset-password">
    {! @csrf_field() }
    <input type="hidden" name="token" value="{ $data.token }">
    <p><label>New password<br><input type="password" name="password" required autocomplete="new-password"></label></p>
    <p><button>Change password</button></p>
  </form>
</layout>
