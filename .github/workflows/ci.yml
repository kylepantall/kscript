name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    # closed is here only to stop work: see the concurrency note below.
    types: [ opened, synchronize, reopened, closed ]

# One run at a time per pull request, and one for master; a newer run cancels the older one, whether it is running
# or still queued. That covers three cases:
# - a new push to a pull request cancels the run for the push before it;
# - merging or closing a pull request starts a run in the same group, which cancels whatever is left of that pull
#   request's run, and its jobs are all skipped (the `if:` on each job), so nothing more runs for a closed PR;
# - a new commit on master cancels master's older run, since the newest run tests everything the older one did.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # One Release build of the solution on Linux, shared by every Linux job that runs kscript or the unit tests (the
  # tests, the project templates, the VS Code extension and the databases), so it compiles once instead of in each
  # of them. They download it and run it in their own checkout, where the tests find the repository by KScript.sln as
  # they do after a local build. Windows and macOS build their own in the test job.
  build-linux:
    name: Build (linux)
    if: github.event.action != 'closed'
    timeout-minutes: 15
    # Pull requests from forks build on a GitHub-hosted runner so untrusted code never executes on home-ci.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["home-ci-linux"]') }}
    steps:
      - uses: actions/checkout@v5

      # home-ci has no system-wide .NET SDK and the runner user can't write to
      # setup-dotnet's default /usr/share/dotnet, so on the self-hosted job it
      # installs into the runner's tool cache (kept between jobs) instead.
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.tool_cache) || '' }}
        with:
          dotnet-version: 8.0.x

      # A fork's build runs on a GitHub-hosted runner, which starts empty. home-ci keeps its own package folder.
      - uses: actions/cache@v5
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build KScript.sln --configuration Release

      # Only what the other jobs run: kscript and the two test projects. One tar keeps file modes and uploads as one
      # file instead of thousands.
      - name: Pack the build
        run: |
          tar -cf "$RUNNER_TEMP/kscript-linux-release.tar" KScriptApp/bin/Release/net8.0 \
            KScript.Tests/bin/Release/net8.0 KScript.Language.Tests/bin/Release/net8.0
          ls -lh "$RUNNER_TEMP/kscript-linux-release.tar"

      - uses: actions/upload-artifact@v6
        with:
          name: kscript-linux-release
          path: ${{ runner.temp }}/kscript-linux-release.tar
          retention-days: 1

  # Every kscript make project template, with the option mixes in .github/scripts/check-templates.sh, made and
  # checked, formatted, tested and served. It skips the unit tests, so it fails within minutes when a change to the
  # language, the formatter or a package breaks a template.
  templates:
    name: Project templates
    needs: build-linux
    timeout-minutes: 15
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["home-ci-linux"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.tool_cache) || '' }}
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v7
        with:
          name: kscript-linux-release
          path: ${{ runner.temp }}

      - name: Unpack the Linux build
        run: tar -xf "$RUNNER_TEMP/kscript-linux-release.tar"

      - name: Make, check, test and serve every template
        run: .github/scripts/check-templates.sh "dotnet $PWD/KScriptApp/bin/Release/net8.0/KScript.dll"

  # The unit tests and the sample checks on Linux, with the build from build-linux. It runs on home-ci (home-ci-linux,
  # via runner-warden); pull requests from forks fall back to a GitHub-hosted runner.
  test-linux:
    name: Test (linux)
    needs: build-linux
    timeout-minutes: 20
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["home-ci-linux"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.tool_cache) || '' }}
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v7
        with:
          name: kscript-linux-release
          path: ${{ runner.temp }}

      - name: Unpack the Linux build
        run: tar -xf "$RUNNER_TEMP/kscript-linux-release.tar"
      - name: Test
        run: >-
          dotnet test KScript.Tests/bin/Release/net8.0/KScript.Tests.dll
          KScript.Language.Tests/bin/Release/net8.0/KScript.Language.Tests.dll --logger "console;verbosity=normal"

      - name: Check the samples and new projects
        run: .github/scripts/check-samples.sh "dotnet $PWD/KScriptApp/bin/Release/net8.0/KScript.dll"

  # Windows and macOS build their own: a Linux build can't stand in for them. They run on GitHub-hosted runners,
  # which are free for this public repo and faster than queueing for a Windows machine at home.
  test:
    name: Build and test (${{ matrix.name }})
    if: github.event.action != 'closed'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos,   os: macos-latest }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # GitHub-hosted runners start empty, so keep the NuGet packages between runs (restore on Windows took
      # ~40 s without them).
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore KScript.sln

      - name: Build
        run: dotnet build KScript.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KScript.sln --configuration Release --no-build --verbosity normal

      - name: Check the samples and new projects
        shell: bash
        run: .github/scripts/check-samples.sh "dotnet $PWD/KScriptApp/bin/Release/net8.0/KScript.dll"

  # KScript.Data's and the database queue's tests, run again on each database server KScript.Data supports. The
  # servers are service containers, so this runs on GitHub-hosted Linux, which has Docker.
  databases:
    name: Databases (${{ matrix.name }})
    needs: build-linux
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: postgres, image: 'postgres:17-alpine', port: 5432, url: 'postgres://kscript:secret@127.0.0.1:5432/kscript',
              health: 'pg_isready -U kscript' }
          - { name: mysql, image: 'mysql:8.4', port: 3306, url: 'mysql://kscript:secret@127.0.0.1:3306/kscript',
              health: 'mysqladmin ping -h 127.0.0.1 -ukscript -psecret' }
          - { name: mariadb, image: 'mariadb:11', port: 3306, url: 'mariadb://kscript:secret@127.0.0.1:3306/kscript',
              health: 'healthcheck.sh --connect --innodb_initialized' }
    services:
      db:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        env:
          POSTGRES_USER: kscript
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: kscript
          MYSQL_USER: kscript
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: kscript
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MARIADB_USER: kscript
          MARIADB_PASSWORD: secret
          MARIADB_DATABASE: kscript
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v7
        with:
          name: kscript-linux-release
          path: ${{ runner.temp }}

      - name: Unpack the Linux build
        run: tar -xf "$RUNNER_TEMP/kscript-linux-release.tar"

      - name: Test on ${{ matrix.name }}
        env:
          KSCRIPT_TEST_DATABASE_URL: ${{ matrix.url }}
        run: >-
          dotnet test KScript.Tests/bin/Release/net8.0/KScript.Tests.dll --logger "console;verbosity=normal"
          --filter "FullyQualifiedName~KScript.Tests.Data|FullyQualifiedName~KScript.Tests.DatabaseServer|FullyQualifiedName~KScript.Tests.QueueTests"

  native-aot:
    name: Native AOT and kscript compile (${{ matrix.name }})
    if: github.event.action != 'closed'
    timeout-minutes: 30
    # kscript releases are Native AOT builds. This publishes one per OS, fails on any new trim or AOT warning, and runs
    # the commands that matter with it: scripts, check/fmt/test, openapi, serve, docs, MCP, KScript.AI (against a
    # stand-in API), kscript compile and the language server.
    #
    # It also publishes the single-file runtime that programs are made from, as release.yml does, and compiles a
    # terminal script, Life Lab and a site with it, and runs what it can. Programs for other platforms come out
    # byte-for-byte the same wherever they are compiled, so each platform checks its own.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest,  rid: linux-x64, target: linux-x64, ext: '' }
          - { name: macos,   os: macos-latest,   rid: osx-arm64, target: mac-arm64, ext: '' }
          - { name: windows, os: windows-latest, rid: win-x64,   target: win-x64,   ext: '.exe' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish with PublishAot
        run: |
          dotnet publish KScriptApp/KScriptApp.csproj --configuration Release --runtime ${{ matrix.rid }} \
            -p:PublishAot=true -p:TrimmerSingleWarn=false -p:DebugType=none -p:Version=0.0.0-aot --output aot | tee aot.log
          # Allowed: one warning inside ASP.NET Core 8 (JsonOptions), and the IL2113 warnings on Microsoft.Data.Sqlite's
          # SqliteConnectionStringBuilder (its designer surface, ICustomTypeDescriptor), both on paths kscript doesn't use.
          # Anything else fails the job.
          grep -o "warning IL[0-9]*: [^[]*" aot.log | sort -u | grep -v "Microsoft.AspNetCore.Http.Json.JsonOptions" \
            | grep -v "IL2113: Microsoft.Data.Sqlite.SqliteConnectionStringBuilder: .*ICustomTypeDescriptor" > warnings.txt || true
          if [ -s warnings.txt ]; then echo "New trim or AOT warnings:"; cat warnings.txt; exit 1; fi
          ls -l aot
          echo "K=$PWD/aot/KScript${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Run, check and test scripts
        run: |
          printf '<kscript>\n  <import package="KScript.Math" />\n  <let name="n" value="@sqrt(9)" />\n  <echo>kscript ok: $n</echo>\n</kscript>\n' > smoke.ks.xml
          "$K" smoke.ks.xml | tee smoke.out
          grep -q "kscript ok: 3" smoke.out
          "$K" samples/scripts/oldest.kscript
          "$K" check samples/scripts samples/xml samples/life-lab samples/http-app samples/storage samples/data --warnings-as-errors
          "$K" fmt --check samples/scripts samples/xml samples/life-lab samples/http-app samples/storage samples/data "Example Sites/team"
          "$K" test samples/scripts samples/xml samples/life-lab samples/queue-app samples/data
          # KScript.Data's SQLite library ships beside kscript, like the UI's.
          (cd samples/data && "$K" shop.kscript | grep -q "Paid orders: 1")
          (cd samples/queue-app && export KSCRIPT_STORAGE_ROOT="$RUNNER_TEMP/kscript-queue" && "$K" signup.kscript && "$K" worker --stop-when-empty | tee "$RUNNER_TEMP/worker.out" && "$K" queue status)
          grep -q "Ran 4 jobs." "$RUNNER_TEMP/worker.out"
          "$K" openapi samples/http-app | grep -q '"openapi": "3.1.0"'
          time "$K" --version

      - name: KScript.AI against a stand-in API
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ci
          ANTHROPIC_BASE_URL: http://127.0.0.1:8765
        run: |
          python3 .github/scripts/fake-claude.py 8765 &
          sleep 2
          printf '%s\n' 'import KScript.AI' "echo \"{ @llm('Say hi.') }\"" \
            "llm(into: t, schema: { category: 'bug|feature', urgency: 'int 1-5' }) \"Triage: it crashes\"" 'echo "{$t.category} {$t.urgency}"' \
            '/// The status of an order.' "fn order_status(id: int) => \$id == 42 ? 'shipped' : 'unknown'" \
            'llm(into: a, tools: [@order_status]) "Where is order 42?"' 'echo "{$a}"' > ai.kscript
          "$K" ai.kscript | tee ai.out
          grep -q "hello from claude" ai.out
          grep -q "bug 4" ai.out
          grep -q "tool said shipped" ai.out

      - name: Publish the single-file runtime
        run: |
          # Built like release.yml: compressed, except on macOS (see the note there).
          COMPRESS=true
          if [[ "${{ matrix.rid }}" == osx-* ]]; then COMPRESS=false; fi
          dotnet publish KScriptApp/KScriptApp.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=$COMPRESS \
            -p:DebugType=none -p:Version=0.0.0-aot --output runtime > /dev/null
          ls -l runtime
          echo "RUNTIME=$PWD/runtime/KScript${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Compile and run a terminal program
        run: |
          mkdir -p "$RUNNER_TEMP/hello"
          printf '<kscript>\n  <import package="KScript.Math" />\n  <echo>compiled ok: {@sqrt(9)} {$args->join(",")}</echo>\n</kscript>\n' > "$RUNNER_TEMP/hello/hello.ks.xml"
          "$K" compile "$RUNNER_TEMP/hello/hello.ks.xml" --runtime "$RUNTIME"
          program="$RUNNER_TEMP/hello/dist/${{ matrix.target }}/hello${{ matrix.ext }}"
          ls -l "$program"
          "$program" a b | tee out.txt
          grep -q "compiled ok: 3 a,b" out.txt
          if [ "${{ matrix.name }}" = macos ]; then codesign --verify --verbose "$program"; fi
          # The single-file runtime compiles programs too, from itself.
          "$RUNTIME" compile "$RUNNER_TEMP/hello/hello.ks.xml" --out "$RUNNER_TEMP/hello-self"
          "$RUNNER_TEMP/hello-self/${{ matrix.target }}/hello${{ matrix.ext }}" a b | grep -q "compiled ok: 3 a,b"

      - name: Compile Life Lab (desktop app)
        run: |
          "$K" compile samples/life-lab --runtime "$RUNTIME" --out "$RUNNER_TEMP/life-lab"
          ls -lR "$RUNNER_TEMP/life-lab"
          case "${{ matrix.name }}" in
            macos) codesign --verify --deep --verbose "$RUNNER_TEMP/life-lab/mac-arm64/Life Lab.app" ;;
            windows) test -f "$RUNNER_TEMP/life-lab/win-x64/Life Lab.exe" ;;
            linux) test -x "$RUNNER_TEMP/life-lab/linux-x64/Life-Lab" && test -f "$RUNNER_TEMP/life-lab/linux-x64/Life-Lab.desktop" ;;
          esac

      - name: Compile and serve a site
        timeout-minutes: 5
        run: |
          "$K" compile "Example Sites/team" --runtime "$RUNTIME" --out "$RUNNER_TEMP/site"
          "$RUNNER_TEMP/site/${{ matrix.target }}/team${{ matrix.ext }}" --port 8097 --host 127.0.0.1 > site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf --max-time 5 http://127.0.0.1:8097/ > page.html && break; sleep 1; done
          curl -sf --max-time 10 http://127.0.0.1:8097/site.css > site.css || true
          kill %1 || true
          cat site.log
          grep -q "Team" page.html
          test -s site.css

      - name: Serve kscript docs from the single-file runtime (pages, static files and the run API)
        # Every request has a time limit, so a server that stops answering fails this step in seconds (with its
        # log printed) instead of holding the runner until the job times out.
        timeout-minutes: 5
        run: |
          "$RUNTIME" docs --no-open --port 8099 > docs.log 2>&1 &
          server=$!
          get() { curl -sf --max-time 10 "$@"; }
          for i in $(seq 1 30); do curl -sf --max-time 5 http://localhost:8099/ > docs.html && break; sleep 1; done
          get http://localhost:8099/assets/docs.css > docs.css || true
          get http://localhost:8099/assets/docs.js > docs.js || true
          # A browser asks for many files at once, and cancels some: do the same, several rounds.
          for round in 1 2 3 4 5; do
            pids=()
            for f in docs.css docs.js favicon.svg search.json docs.css docs.js; do
              curl -s -o /dev/null --max-time 10 "http://localhost:8099/assets/$f" & pids+=($!)
              curl -s -o /dev/null --max-time 0.01 "http://localhost:8099/assets/$f" & pids+=($!)
            done
            wait "${pids[@]}" 2>/dev/null || true
          done
          get http://localhost:8099/assets/favicon.svg > favicon.svg || true
          get -X POST http://localhost:8099/api/run -H "X-KScript-Docs: 1" -H "Content-Type: application/json" \
            -d '{"code":"<echo>docs ok</echo>"}' > run.json || true
          kill $server || true
          cat docs.log
          grep -q "KScript" docs.html
          test -s docs.css && test -s docs.js && test -s favicon.svg
          grep -q "docs ok" run.json

      - name: Serve a site, the docs and MCP
        timeout-minutes: 5
        run: |
          (cd samples/http-app && "$K" serve --port 8092 > ../../serve.log 2>&1 &)
          "$K" docs --no-open --port 8098 > docs.log 2>&1 &
          for i in $(seq 1 30); do curl -sf --max-time 10 http://localhost:8092/people > people.html && curl -sf --max-time 10 http://localhost:8098/ > docs.html && break; sleep 1; done
          curl -sf --max-time 10 http://localhost:8092/_openapi.json | grep -q '"openapi"'
          curl -sf --max-time 10 http://localhost:8098/assets/search.json | grep -q '"t":'
          curl -sf --max-time 10 -X POST http://localhost:8098/api/run -H "X-KScript-Docs: 1" -H "Content-Type: application/json" \
            -d '{"code":"<echo>docs ok</echo>"}' | grep -q "docs ok"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | "$K" mcp | tee mcp.out
          grep -q "search_docs" mcp.out
          cat serve.log docs.log

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Language server smoke test
        timeout-minutes: 5
        working-directory: editors/vscode
        run: |
          npm ci
          npm run smoke -- "$K"

  vscode:
    name: VS Code extension
    needs: build-linux
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: actions/download-artifact@v7
        with:
          name: kscript-linux-release
          path: ${{ runner.temp }}

      - name: Unpack the Linux build
        working-directory: .
        run: tar -xf "$RUNNER_TEMP/kscript-linux-release.tar"

      - name: Install
        run: npm ci

      - name: Check and unit test
        run: |
          npm run check
          npm test

      - name: Package
        run: npm run package

      - name: Language server smoke test
        run: npm run smoke -- ../../KScriptApp/bin/Release/net8.0/KScript.dll

      - name: Run in VS Code
        run: xvfb-run -a npm run test:vscode -- ../../KScriptApp/bin/Release/net8.0/KScript.dll

      - uses: actions/upload-artifact@v6
        with:
          name: kscript-vscode
          path: editors/vscode/kscript-vscode.vsix
