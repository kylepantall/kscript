name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

# A new push to a pull request cancels the run for the push before it, so the queue only holds runs that still
# matter. Runs on master always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: Build and test (${{ matrix.name }})
    # The Linux and Windows jobs run on home-ci (home-ci-kscript-r1, and a runner on its Windows VM), self-hosted
    # runners registered to this repository only.
    # Pull requests from forks always fall back to a GitHub-hosted runner so
    # untrusted code never executes on home-ci.
    timeout-minutes: 20
    runs-on: ${{ (matrix.self-hosted && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && fromJSON(matrix.runner) || matrix.hosted }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            self-hosted: true
            runner: '["self-hosted","Linux","X64","kscript"]'
            hosted: ubuntu-latest
          - name: windows
            self-hosted: true
            runner: '["self-hosted","Windows","X64","kscript"]'
            hosted: windows-latest
          - name: macos
            self-hosted: false
            hosted: macos-latest

    steps:
      - uses: actions/checkout@v4

      # home-ci has no system-wide .NET SDK and the runner user can't write to
      # setup-dotnet's default /usr/share/dotnet, so on the self-hosted job it
      # installs into the runner's tool cache (kept between jobs) instead.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ matrix.self-hosted && format('{0}/dotnet', runner.tool_cache) || '' }}
        with:
          dotnet-version: 8.0.x

      # GitHub-hosted runners start empty, so keep the NuGet packages between runs (restore on Windows took
      # ~40 s without them). home-ci keeps its own package folder between jobs.
      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore KScript.sln

      - name: Build
        run: dotnet build KScript.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KScript.sln --configuration Release --no-build --verbosity normal

      - name: Run sample script
        run: dotnet KScriptApp/bin/Release/net8.0/KScript.dll "Example Scripts/Find Oldest Person.xml"

      - name: Check KScript 2 samples
        run: dotnet KScriptApp/bin/Release/net8.0/KScript.dll check samples/kscript2 samples/life-lab samples/http-app samples/storage "Example Scripts" --warnaserror

      - name: Check KScript formatting
        run: dotnet KScriptApp/bin/Release/net8.0/KScript.dll fmt --check samples/kscript2 samples/life-lab samples/http-app samples/storage samples/code-format "Example Scripts" "Example Sites/team"

      - name: Run KScript tests
        run: dotnet KScriptApp/bin/Release/net8.0/KScript.dll test samples/kscript2 samples/life-lab

      - name: Check a new project (kscript make project)
        shell: bash
        run: |
          k="dotnet $PWD/KScriptApp/bin/Release/net8.0/KScript.dll"
          cd "$RUNNER_TEMP"
          $k make project new-app
          $k check new-app --warnaserror
          $k fmt --check new-app
          $k test new-app
          $k agents --check new-app
          $k make project xml-app --format xml
          $k check xml-app --warnaserror
          $k fmt --check xml-app
          $k test xml-app
          $k agents --check xml-app
          $k make project bare-tool --bare
          $k check bare-tool --warnaserror
          $k test bare-tool
          $k agents --check bare-tool
          $k bare-tool/main.kscript
          $k make project bare-app --bare --web --api --desktop
          $k check bare-app --warnaserror
          $k fmt --check bare-app
          $k test bare-app
          $k agents --check bare-app
          # The generators: routes add themselves to routes/, and everything they make checks and formats cleanly.
          cd bare-app
          $k make route users
          $k make route "users/{id}" --where "id: int"
          $k make route users --method post
          $k make route people --resource --api
          $k make route about --view about
          $k make request NewPerson --fields "name: string, age?: int"
          $k make middleware secure-headers
          $k make type Repo --fields "name: string, stars: int"
          $k make enum Size --values small,medium,large
          $k make error PaymentFailed --status 402 --extends Validation --fields "order: int, reason?: string"
          $k make css theme
          $k check .
          $k fmt --check .
          $k routes .
          $k test .

  compile:
    name: kscript compile (${{ matrix.name }})
    # Builds a release-style kscript for the runner, compiles a terminal script, Life Lab and a site with it,
    # and runs what it can. Programs for other platforms come out byte-for-byte the same wherever they are
    # compiled, so each platform checks its own.
    timeout-minutes: 20
    runs-on: ${{ (matrix.self-hosted && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && fromJSON(matrix.runner) || matrix.hosted }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   rid: linux-x64, target: linux-x64, self-hosted: true,  runner: '["self-hosted","Linux","X64","kscript"]',   hosted: ubuntu-latest,  ext: '' }
          - { name: windows, rid: win-x64,   target: win-x64,   self-hosted: true,  runner: '["self-hosted","Windows","X64","kscript"]', hosted: windows-latest, ext: '.exe' }
          - { name: macos,   rid: osx-arm64, target: mac-arm64, self-hosted: false, hosted: macos-latest,   ext: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ matrix.self-hosted && format('{0}/dotnet', runner.tool_cache) || '' }}
        with:
          dotnet-version: 8.0.x

      # GitHub-hosted runners start empty, so keep the NuGet packages between runs (restore on Windows took
      # ~40 s without them). home-ci keeps its own package folder between jobs.
      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-

      - name: Publish a single-file kscript
        run: |
          # Built like release.yml: compressed, except on macOS (see the note there).
          COMPRESS=true
          if [[ "${{ matrix.rid }}" == osx-* ]]; then COMPRESS=false; fi
          dotnet publish KScriptApp/KScriptApp.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=$COMPRESS \
            -p:DebugType=none -p:Version=0.0.0-ci --output publish

      - name: Compile and run a terminal program
        run: |
          mkdir -p "$RUNNER_TEMP/hello"
          printf '<kscript>\n  <import package="KScript.Math" />\n  <echo>compiled ok: {@sqrt(9)} {$args->join(",")}</echo>\n</kscript>\n' > "$RUNNER_TEMP/hello/hello.ks.xml"
          ./publish/KScript${{ matrix.ext }} compile "$RUNNER_TEMP/hello/hello.ks.xml"
          program="$RUNNER_TEMP/hello/dist/${{ matrix.target }}/hello${{ matrix.ext }}"
          ls -l "$program" publish/
          "$program" a b | tee out.txt
          grep -q "compiled ok: 3 a,b" out.txt
          if [ "${{ matrix.name }}" = macos ]; then codesign --verify --verbose "$program"; fi

      - name: Compile Life Lab (desktop app)
        run: |
          ./publish/KScript${{ matrix.ext }} compile samples/life-lab --out "$RUNNER_TEMP/life-lab"
          ls -lR "$RUNNER_TEMP/life-lab"
          case "${{ matrix.name }}" in
            macos) codesign --verify --deep --verbose "$RUNNER_TEMP/life-lab/mac-arm64/Life Lab.app" ;;
            windows) test -f "$RUNNER_TEMP/life-lab/win-x64/Life Lab.exe" ;;
            linux) test -x "$RUNNER_TEMP/life-lab/linux-x64/Life-Lab" && test -f "$RUNNER_TEMP/life-lab/linux-x64/Life-Lab.desktop" ;;
          esac

      - name: Compile and serve a site
        timeout-minutes: 5
        run: |
          ./publish/KScript${{ matrix.ext }} compile "Example Sites/team" --out "$RUNNER_TEMP/site"
          "$RUNNER_TEMP/site/${{ matrix.target }}/team${{ matrix.ext }}" --port 8097 --host 127.0.0.1 > site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf --max-time 5 http://127.0.0.1:8097/ > page.html && break; sleep 1; done
          curl -sf --max-time 10 http://127.0.0.1:8097/site.css > site.css || true
          kill %1 || true
          cat site.log
          grep -q "Team" page.html
          test -s site.css

      - name: Serve kscript docs (pages, static files and the run API)
        # Every request has a time limit, so a server that stops answering fails this step in seconds (with its
        # log printed) instead of holding the runner until the job times out.
        timeout-minutes: 5
        run: |
          ./publish/KScript${{ matrix.ext }} docs --no-open --port 8098 > docs.log 2>&1 &
          server=$!
          get() { curl -sf --max-time 10 "$@"; }
          for i in $(seq 1 30); do curl -sf --max-time 5 http://localhost:8098/ > docs.html && break; sleep 1; done
          get http://localhost:8098/assets/docs.css > docs.css || true
          get http://localhost:8098/assets/docs.js > docs.js || true
          # A browser asks for many files at once, and cancels some: do the same, several rounds.
          for round in 1 2 3 4 5; do
            pids=()
            for f in docs.css docs.js favicon.svg search.json docs.css docs.js; do
              curl -s -o /dev/null --max-time 10 "http://localhost:8098/assets/$f" & pids+=($!)
              curl -s -o /dev/null --max-time 0.01 "http://localhost:8098/assets/$f" & pids+=($!)
            done
            wait "${pids[@]}" 2>/dev/null || true
          done
          get http://localhost:8098/assets/favicon.svg > favicon.svg || true
          get -X POST http://localhost:8098/api/run -H "X-KScript-Docs: 1" -H "Content-Type: application/json" \
            -d '{"code":"<echo>docs ok</echo>"}' > run.json || true
          kill $server || true
          cat docs.log
          grep -q "KScript" docs.html
          test -s docs.css && test -s docs.js && test -s favicon.svg
          grep -q "docs ok" run.json

  native-aot:
    name: Native AOT (linux, experimental)
    timeout-minutes: 25
    # Checks that kscript still builds and runs as a Native AOT binary: no new trim or AOT warnings, and the
    # commands that matter work. Releases still ship the single-file build; this job only keeps the AOT path open.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish with PublishAot
        run: |
          dotnet publish KScriptApp/KScriptApp.csproj --configuration Release --runtime linux-x64 \
            -p:PublishAot=true -p:TrimmerSingleWarn=false -p:DebugType=none -p:Version=0.0.0-aot --output aot | tee aot.log
          # Allowed: one warning inside ASP.NET Core 8 (JsonOptions), on a path kscript doesn't use, and the Anthropic
          # SDK's own (KScript.AI doesn't work in an AOT build yet). Anything in kscript's code fails the job.
          grep -o "warning IL[0-9]*: [^[]*" aot.log | sort -u | grep -v "Microsoft.AspNetCore.Http.Json.JsonOptions" | grep -v "warning IL[0-9]*: Anthropic\." > warnings.txt || true
          if [ -s warnings.txt ]; then echo "New trim or AOT warnings:"; cat warnings.txt; exit 1; fi
          ls -l aot

      - name: Run, check and test scripts
        run: |
          k="$PWD/aot/KScript"
          printf '<kscript>\n  <import package="KScript.Math" />\n  <let name="n" value="@sqrt(9)" />\n  <echo>kscript ok: $n</echo>\n</kscript>\n' > smoke.xml
          "$k" smoke.xml | tee smoke.out
          grep -q "kscript ok: 3" smoke.out
          "$k" "Example Scripts/Find Oldest Person.xml"
          "$k" check samples/kscript2 samples/life-lab samples/http-app samples/storage "Example Scripts" --warnaserror
          "$k" fmt --check samples/kscript2 samples/life-lab samples/http-app samples/storage "Example Scripts" "Example Sites/team"
          "$k" test samples/kscript2 samples/life-lab
          "$k" openapi samples/http-app | grep -q '"openapi": "3.1.0"'
          time "$k" --version

      - name: Serve a site, the docs and MCP
        timeout-minutes: 5
        run: |
          k="$PWD/aot/KScript"
          (cd samples/http-app && "$k" serve --port 8092 > ../../serve.log 2>&1 &)
          "$k" docs --no-open --port 8098 > docs.log 2>&1 &
          for i in $(seq 1 30); do curl -sf --max-time 10 http://localhost:8092/people > people.html && curl -sf --max-time 10 http://localhost:8098/ > docs.html && break; sleep 1; done
          curl -sf --max-time 10 http://localhost:8092/_openapi.json | grep -q '"openapi"'
          curl -sf --max-time 10 http://localhost:8098/assets/search.json | grep -q '"t":'
          curl -sf --max-time 10 -X POST http://localhost:8098/api/run -H "X-KScript-Docs: 1" -H "Content-Type: application/json" \
            -d '{"code":"<echo>docs ok</echo>"}' | grep -q "docs ok"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | "$k" mcp | tee mcp.out
          grep -q "search_docs" mcp.out
          cat serve.log docs.log

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Language server smoke test
        timeout-minutes: 5
        working-directory: editors/vscode
        run: |
          npm ci
          npm run smoke -- ../../aot/KScript

  vscode:
    name: VS Code extension
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build kscript
        working-directory: .
        run: dotnet build KScriptApp/KScriptApp.csproj --configuration Release

      - name: Install
        run: npm ci

      - name: Check and unit test
        run: |
          npm run check
          npm test

      - name: Package
        run: npm run package

      - name: Language server smoke test
        run: npm run smoke -- ../../KScriptApp/bin/Release/net8.0/KScript.dll

      - name: Run in VS Code
        run: xvfb-run -a npm run test:vscode -- ../../KScriptApp/bin/Release/net8.0/KScript.dll

      - uses: actions/upload-artifact@v4
        with:
          name: kscript-vscode
          path: editors/vscode/kscript-vscode.vsix
