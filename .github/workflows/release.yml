name: Release

# Builds self-contained, single-file `kscript` binaries that run without the .NET SDK or runtime.
# Push a tag like v2.0.0 to publish a GitHub release, or run it by hand to get the binaries as
# workflow artifacts.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest,  ext: '' }
          - { rid: linux-arm64, os: ubuntu-latest,  ext: '' }
          # macOS binaries are built on macOS so they get the ad-hoc code signature Apple Silicon requires.
          - { rid: osx-arm64,   os: macos-latest,   ext: '' }
          - { rid: osx-x64,     os: macos-latest,   ext: '' }
          - { rid: win-x64,     os: windows-latest, ext: '.exe' }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: bash
        run: |
          # The tag (v0.1.0) becomes the binary's version, which `kscript update` compares against releases.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          dotnet publish KScriptApp/KScriptApp.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            --output publish

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "publish/KScript${{ matrix.ext }}" "dist/kscript${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            (cd dist && 7z a "../kscript-${{ matrix.rid }}.zip" "kscript.exe")
          else
            chmod +x dist/kscript
            tar -czf "kscript-${{ matrix.rid }}.tar.gz" -C dist kscript
          fi

      - name: Smoke test
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        shell: bash
        run: |
          printf '<kscript>\n  <def id="n">3</def>\n  <echo>kscript ok: $n</echo>\n</kscript>\n' > smoke.xml
          ./dist/kscript${{ matrix.ext }} smoke.xml -s -nowait | tee smoke.out
          grep -q "kscript ok: 3" smoke.out
          ./dist/kscript${{ matrix.ext }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: kscript-${{ matrix.rid }}
          path: kscript-${{ matrix.rid }}.*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
