name: Release

# Builds self-contained, single-file `kscript` binaries that run without the .NET SDK or runtime.
# Push a tag like v2.0.0 to publish a GitHub release, or run it by hand to get the binaries as
# workflow artifacts.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest,  ext: '' }
          - { rid: linux-arm64, os: ubuntu-latest,  ext: '' }
          # macOS binaries are built on macOS so they get the ad-hoc code signature Apple Silicon requires.
          - { rid: osx-arm64,   os: macos-latest,   ext: '' }
          - { rid: osx-x64,     os: macos-latest,   ext: '' }
          - { rid: win-x64,     os: windows-latest, ext: '.exe' }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: bash
        run: |
          # The tag (v0.1.0) becomes the binary's version, which `kscript update` compares against releases.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          dotnet publish KScriptApp/KScriptApp.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            --output publish

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "publish/KScript${{ matrix.ext }}" "dist/kscript${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            (cd dist && 7z a "../kscript-${{ matrix.rid }}.zip" "kscript.exe")
          else
            chmod +x dist/kscript
            tar -czf "kscript-${{ matrix.rid }}.tar.gz" -C dist kscript
          fi

      - name: Smoke test
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        shell: bash
        run: |
          printf '<kscript>\n  <def id="n">3</def>\n  <echo>kscript ok: $n</echo>\n</kscript>\n' > smoke.xml
          ./dist/kscript${{ matrix.ext }} smoke.xml -s -nowait | tee smoke.out
          grep -q "kscript ok: 3" smoke.out
          ./dist/kscript${{ matrix.ext }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: kscript-${{ matrix.rid }}
          path: kscript-${{ matrix.rid }}.*

  vscode:
    name: Build the editor extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Package
        shell: bash
        run: |
          npm ci
          npm test
          # The extension gets the release's version (v0.2.0 -> 0.2.0), so `kscript ide install` matches them up.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"; fi
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: kscript-vscode
          path: editors/vscode/kscript-vscode.vsix

  release:
    name: Publish release
    needs: [build, vscode]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

  marketplace:
    name: Publish the editor extension
    needs: release
    runs-on: ubuntu-latest
    # Each step runs only when its token is set as a repository secret, so releases work without them.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kscript-vscode

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --packagePath kscript-vscode.vsix --skip-duplicate

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish kscript-vscode.vsix --skip-duplicate

  verify:
    name: Verify installers (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    env:
      KSCRIPT_VERSION: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh
          ~/.kscript/bin/kscript --version | tee version.out
          grep -qx "${GITHUB_REF_NAME#v}" version.out
          ~/.kscript/bin/kscript update --check
          ~/.kscript/bin/kscript update --force

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\kscript\kscript.exe'
          $v = & $exe --version
          if ($v -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw "expected $env:GITHUB_REF_NAME, got $v" }
          & $exe update --check
          & $exe update --force
          if ($LASTEXITCODE -ne 0) { throw "kscript update failed" }
          & $exe --version
