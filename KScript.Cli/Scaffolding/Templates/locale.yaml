--- make
description: Translations for one language in locales/, for @t('key') in scripts and pages
category: Settings
usage: <locale> [--keys hello,goodbye]
--keys: Keys to add, comma separated, each with its name as the text to translate
example: kscript make locale fr
example: kscript make locale en-GB --keys welcome,sign_in
to: {{ paths.locales }}/{{ name }}.yaml
hint: Use it with locale(set: {{ name }}) and @t('hello', { name: 'Ann' }). Pages pick it from /{{ name }}/… or ?lang={{ name }}
---
# Translations for {{ name }}. @t('key') looks the key up; {name} in the text is filled from the values passed in.
hello: Hello, {name}!
items:
  "=0": Nothing here yet
  one: "{count} item"
  other: "{count} items"
{{#each keys}}
{{ item | snake }}: {{ item | title }}
{{/each}}
