# Settings that every script reads as $config, such as $config.app.name (see the language guide).
# config.<env>.yaml files are laid over these with kscript --env <env>; kscript test uses config.test.yaml.
# ${NAME:-default} reads an environment variable (or .env), so a server or Docker can change a setting.
app:
  name: {{ title }}
{{#if db is none}}

notes:
  file: data/notes.json
{{/if}}
{{#unless db is none}}

database:
  connections:
    main:
{{#if db is sqlite}}
      url: ${DATABASE_URL:-sqlite:data/app.sqlite}
{{/if}}
{{#if db is postgres}}
      url: ${DATABASE_URL:-postgres://{{ snake }}:secret@localhost:5432/{{ snake }}}
{{/if}}
{{#if db is mysql}}
      url: ${DATABASE_URL:-mysql://{{ snake }}:secret@localhost:3306/{{ snake }}}
{{/if}}
{{/unless}}
{{#if cache}}

cache:
  # memory is shared by every request while kscript serve runs; file keeps values between runs.
  store: ${CACHE_STORE:-memory}
  ttl: 5m
{{/if}}
