--- make
to: {{ paths.views }}/auth/register.html
---
<layout path="{{ layout }}" title="Create an account">
  <h1>Create an account</h1>
{{#if passkeys}}
  <sign-up-form />
{{else}}
  <sign-up-form
    name="{$data.name ?? ''}"
    email="{$data.email ?? ''}"
    problems="{$data.problems ?? []}" />
{{/if}}
  <p>Already have one? <a href="/login">Sign in</a></p>
</layout>
