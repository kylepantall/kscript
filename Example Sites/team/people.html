<let name="people" value="@read_json('data/people.json')" />
<let
  name="min"
  value="($request.query.min_age ?? '0')->to_number(default: 0)" />
<let
  name="matches"
  value="$people |> filter(fn($p) => $p.age ge $min) |> sort_by(fn($p) => $p.name)" />

<layout src="_layout.html" title="People">
  <h1>People aged {$min} and over</h1>
  <form>
    <label>Minimum age <input name="min_age" type="number" value="{$min}"></label>
    <button>Filter</button>
  </form>

  <ul>
    <for each="p" in="$matches">
      <li class="{ $p.age ge 65 ? 'senior' : 'regular' }">
        <a href="/people/{$p.id}">{$p.name}</a> ({$p.age})
      </li>
    </for>
    <else>
      <li>Nobody matches.</li>
    </else>
  </ul>
</layout>
