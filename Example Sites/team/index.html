<let name="people" value="@read_json('data/people.json')" />
<let name="oldest" value="$people->max_by(fn($p) => $p.age)" />

<layout path="_layout.html" title="Home">
  <h1>Welcome</h1>
  <p>There are {$people->count()} people on the team. The oldest is {$oldest.name} at {$oldest.age}.</p>
  <person-card person="{$oldest}">
    <p>Thanks for everything, {$oldest.name}!</p>
  </person-card>
</layout>
